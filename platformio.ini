; PlatformIO config so this sketch can be built/uploaded from VS Code.
; If upload fails with "not in sync" errors, your Nano has the old bootloader:
; change board to nanoatmega328 (common on cheap clones).

[platformio]
src_dir = .

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
; CH340 Nano clone. If Windows assigns a different COM number, update these.
upload_port = COM12
monitor_port = COM12
